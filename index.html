<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="ventas.js"></script>
    <script src="utilitarios.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="contenedor">
        <h1>Calculadora de Comisiones</h1>

        <label>Salario Base:</label>
        <input type="text" id="btSueldaBase" onblur="validarNumero(this)">
        <div id="error_btSueldaBase" class="mensajeError"></div>

        <label>Número de ventas:</label>
        <input type="text" id="botVentas" onblur="validarNumero(this)">
        <div id="error_botVentas" class="mensajeError"></div>

        <label>Precio del producto:</label>
        <input type="text" id="btPrecio" onblur="validarNumero(this)">
        <div id="error_btPrecio" class="mensajeError"></div>

        <button onclick="calcular();">Calcular Comisión</button>

        <h2>Resultados</h2>
        <p>Salario Base: <span id="spSueldoBase"></span></p>
        <p>Comisión: <span id="spComision"></span></p>
        <p>Total: <span id="spTotal"></span></p>
    </div>


</body>

</html>
